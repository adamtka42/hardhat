name: CI

on:
  push:
    branches:
      - master
      - development
      # We want to build "wip*" branches since they are not intended for PRs.
      - "[Ww][Ii][Pp]*"
  pull_request:
    branches:
      - "*"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
      - name: Install
        run: npm install
      - name: lint
        run: npm run lint
      - name: Check dependency versions
        run: node scripts/check-dependencies.js

  typecheck_tests:
    name: Typecheck tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
      - name: Install
        run: npm install
      - name: Build tests
        run: npm run build-test

  test_windows:
    name: Test on Windows with Node 20
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
      - name: Install
        run: npm install
      - uses: actions/checkout@v4
        with:
          repository: adamtka42/qrljs-monorepo
          ref: qrl-adaptation
          path: qrljs-monorepo
      - name: Install qrljs-monorepo
        working-directory: qrljs-monorepo
        env:
          npm_config_script_shell: "C:\\Program Files\\Git\\bin\\bash.exe"
        run: npm ci
      - name: Build qrljs-monorepo
        working-directory: qrljs-monorepo
        env:
          npm_config_script_shell: "C:\\Program Files\\Git\\bin\\bash.exe"
        run: npm run build --workspaces --if-present
      - name: Run tests
        env:
          QRLJS_MONOREPO_PATH: qrljs-monorepo
        run: npm run test

  test_macos:
    name: Test on MacOS with Node 20
    runs-on: macos-13
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
      - name: Install
        run: npm install
      - uses: actions/checkout@v4
        with:
          repository: adamtka42/qrljs-monorepo
          ref: qrl-adaptation
          path: qrljs-monorepo
      - name: Install qrljs-monorepo
        working-directory: qrljs-monorepo
        run: npm ci
      - name: Build qrljs-monorepo
        working-directory: qrljs-monorepo
        run: npm run build --workspaces --if-present
      - name: Run tests
        env:
          QRLJS_MONOREPO_PATH: qrljs-monorepo
        run: npm run test

  test_linux:
    name: Test on Linux with Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/checkout@v4
      - name: Install
        run: npm install
      - uses: actions/checkout@v4
        with:
          repository: adamtka42/qrljs-monorepo
          ref: qrl-adaptation
          path: qrljs-monorepo
      - name: Install qrljs-monorepo
        working-directory: qrljs-monorepo
        run: npm ci
      - name: Build qrljs-monorepo
        working-directory: qrljs-monorepo
        run: npm run build --workspaces --if-present
      - name: Run tests
        env:
          QRLJS_MONOREPO_PATH: qrljs-monorepo
        run: npm run test
